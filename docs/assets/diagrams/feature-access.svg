<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="title desc">
  <title id="title">Feature access decision flow</title>
  <desc id="desc">How the app decides whether a user can access a feature.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Feature access decision</text>
  <text class="t sub" x="24" y="54">SubscriptionService.isPaidSubscriber() is the primary premium gate</text>
  <rect class="box screen" x="360" y="70" width="160" height="44" rx="10"/>
<text class="t lbl" x="440.0" y="92" text-anchor="middle">Feature request</text>
  <line class="arrow" x1="440" y1="114" x2="440" y2="145"/>
  <rect class="box service" x="310" y="150" width="260" height="44" rx="10"/>
<text class="t lbl" x="440.0" y="172" text-anchor="middle">Authenticated?</text>
<text class="t sm" x="440.0" y="188" text-anchor="middle">Firebase Auth</text>
  <line class="arrow" x1="440" y1="194" x2="440" y2="225"/>
  <rect class="box service" x="310" y="230" width="260" height="44" rx="10"/>
<text class="t lbl" x="440.0" y="252" text-anchor="middle">Onboarding complete?</text>
<text class="t sm" x="440.0" y="268" text-anchor="middle">OnboardingProgressService</text>
  <line class="arrow" x1="440" y1="274" x2="440" y2="305"/>
  <rect class="box premium" x="280" y="310" width="320" height="50" rx="10"/>
<text class="t lbl" x="440.0" y="332" text-anchor="middle">Premium feature?</text>
<text class="t sm" x="440.0" y="348" text-anchor="middle">SubscriptionService</text>
  <rect class="box screen" x="120" y="390" width="140" height="44" rx="10"/>
<text class="t lbl" x="190.0" y="412" text-anchor="middle">Allow</text>
<text class="t sm" x="190.0" y="428" text-anchor="middle">full access</text>
  <rect class="box premium" x="340" y="390" width="140" height="44" rx="10"/>
<text class="t lbl" x="410.0" y="412" text-anchor="middle">Soft paywall</text>
<text class="t sm" x="410.0" y="428" text-anchor="middle">FeatureQuotaService</text>
  <rect class="box premium" x="560" y="390" width="140" height="44" rx="10"/>
<text class="t lbl" x="630.0" y="412" text-anchor="middle">Block / limit</text>
<text class="t sm" x="630.0" y="428" text-anchor="middle">free tier</text>
  <line class="arrow" x1="360" y1="360" x2="190" y2="390"/><line class="arrow" x1="440" y1="360" x2="410" y2="390"/><line class="arrow" x1="520" y1="360" x2="630" y2="390"/>
  <text class="t sm" x="700" y="330">Quotas partially disabled — INFERRED</text>
</svg>
