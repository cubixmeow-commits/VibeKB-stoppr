<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Navigation map</title>
  <desc id="desc">Major screen groups — Navigator.push, not GoRouter.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Navigation map</text>
  <text class="t sub" x="24" y="54">Imperative navigation; MainScaffold hosts 5 tabs</text>
  <rect class="box screen" x="380" y="70" width="160" height="44" rx="10"/>
<text class="t lbl" x="460.0" y="92" text-anchor="middle">Startup</text>
<text class="t sm" x="460.0" y="108" text-anchor="middle">loading → target</text>
  <rect class="box screen" x="80" y="160" width="150" height="50" rx="10"/>
<text class="t lbl" x="155.0" y="182" text-anchor="middle">Onboarding group</text>
<text class="t sm" x="155.0" y="198" text-anchor="middle">30+ screens</text>
  <rect class="box premium" x="260" y="160" width="150" height="50" rx="10"/>
<text class="t lbl" x="335.0" y="182" text-anchor="middle">Paywall group</text>
<text class="t sm" x="335.0" y="198" text-anchor="middle">PrePaywall</text>
  <rect class="box screen" x="440" y="160" width="150" height="50" rx="10"/>
<text class="t lbl" x="515.0" y="182" text-anchor="middle">MainScaffold</text>
<text class="t sm" x="515.0" y="198" text-anchor="middle">tabs 0–4</text>
  <rect class="box screen" x="620" y="160" width="150" height="50" rx="10"/>
<text class="t lbl" x="695.0" y="182" text-anchor="middle">Feature pushes</text>
<text class="t sm" x="695.0" y="198" text-anchor="middle">from HomeScreen</text>
  <rect class="box screen" x="260" y="260" width="150" height="50" rx="10"/>
<text class="t lbl" x="335.0" y="282" text-anchor="middle">Auth screens</text>
<text class="t sm" x="335.0" y="298" text-anchor="middle">EmailAuthScreen</text>
  <rect class="box screen" x="440" y="260" width="150" height="50" rx="10"/>
<text class="t lbl" x="515.0" y="282" text-anchor="middle">Deep links</text>
<text class="t sm" x="515.0" y="298" text-anchor="middle">payment · panic</text>
<text class="t sm" x="515.0" y="312" text-anchor="middle">share invite</text>
  <rect class="box screen" x="620" y="260" width="150" height="50" rx="10"/>
<text class="t lbl" x="695.0" y="282" text-anchor="middle">Settings / profile</text>
<text class="t sm" x="695.0" y="298" text-anchor="middle">tab 4</text>
  <text class="t sm" x="80" y="340">Named route: only /home → MainScaffold</text>
</svg>
