<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Subscription and paywall flow</title>
  <desc id="desc">Free vs paid access via SubscriptionService, Superwall, and RevenueCat.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Subscription &amp; paywall flow</text>
  <text class="t sub" x="24" y="54">Access checks use RevenueCat/Superwall — not Firestore subscription fields</text>
  <rect class="box screen" x="40" y="100" width="120" height="50" rx="10"/>
<text class="t lbl" x="100.0" y="122" text-anchor="middle">Free user</text>
  <line class="arrow" x1="160" y1="125" x2="200" y2="125"/>
  <rect class="box premium" x="205" y="100" width="150" height="50" rx="10"/>
<text class="t lbl" x="280.0" y="122" text-anchor="middle">Paywall trigger</text>
<text class="t sm" x="280.0" y="138" text-anchor="middle">Superwall placement</text>
  <line class="arrow" x1="355" y1="125" x2="395" y2="125"/>
  <rect class="box external" x="400" y="85" width="170" height="80" rx="10"/>
<text class="t lbl" x="485.0" y="107" text-anchor="middle">Superwall + RevenueCat</text>
<text class="t sm" x="485.0" y="123" text-anchor="middle">purchase UI</text>
  <line class="arrow" x1="570" y1="125" x2="610" y2="125"/><text class="t sm" x="590.0" y="119.0" text-anchor="middle">success</text>
  <rect class="box screen" x="615" y="100" width="130" height="50" rx="10"/>
<text class="t lbl" x="680.0" y="122" text-anchor="middle">Congratulations</text>
<text class="t sm" x="680.0" y="138" text-anchor="middle">post-purchase</text>
  <line class="arrow" x1="745" y1="125" x2="785" y2="125"/>
  <rect class="box screen" x="790" y="100" width="110" height="50" rx="10"/>
<text class="t lbl" x="845.0" y="122" text-anchor="middle">MainScaffold</text>
  <rect class="box service" x="205" y="220" width="150" height="50" rx="10"/>
<text class="t lbl" x="280.0" y="242" text-anchor="middle">SubscriptionService</text>
<text class="t sm" x="280.0" y="258" text-anchor="middle">isPaidSubscriber()</text>
  <rect class="box service" x="400" y="210" width="170" height="70" rx="10"/>
<text class="t lbl" x="485.0" y="232" text-anchor="middle">Bypasses</text>
<text class="t sm" x="485.0" y="248" text-anchor="middle">kDebugMode · TestFlight</text>
<text class="t sm" x="485.0" y="262" text-anchor="middle">reviewer emails</text>
  <rect class="box warn" x="615" y="220" width="200" height="50" rx="10"/>
<text class="t lbl" x="715.0" y="242" text-anchor="middle">Placeholder IDs</text>
<text class="t sm" x="715.0" y="258" text-anchor="middle">INSERT_YOUR_*</text>
  <text class="t badge" x="715" y="258" text-anchor="middle">UNVERIFIED RUNTIME</text>
  <rect class="box inferred" x="40" y="320" width="260" height="60" rx="10"/>
<text class="t lbl" x="170.0" y="342" text-anchor="middle">Soft quotas</text>
<text class="t sm" x="170.0" y="358" text-anchor="middle">FeatureQuotaService — partially disabled</text>
  <text class="t lbl" x="40" y="400">Legend</text>
<rect class="box premium" x="40" y="412" width="14" height="14" rx="3"/>
<text class="t sm" x="62" y="424">Paywall</text>
<rect class="box external" x="40" y="432" width="14" height="14" rx="3"/>
<text class="t sm" x="62" y="444">Payment SDK</text>
<rect class="box warn" x="40" y="452" width="14" height="14" rx="3"/>
<text class="t sm" x="62" y="464">Config risk</text>
<rect class="box inferred" x="40" y="472" width="14" height="14" rx="3"/>
<text class="t sm" x="62" y="484">Inferred</text>
</svg>
