<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">Storage map</title>
  <desc id="desc">Where Stoppr keeps identity, cloud data, local state, and bundled assets.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Storage map</text>
  <text class="t sub" x="24" y="54">Collection names from firestore.rules and repositories — no secrets shown</text>
  <rect class="box firebase" x="60" y="100" width="200" height="120" rx="10"/>
<text class="t lbl" x="160.0" y="122" text-anchor="middle">Firestore top-level</text>
<text class="t sm" x="160.0" y="138" text-anchor="middle">users · community_posts</text>
<text class="t sm" x="160.0" y="152" text-anchor="middle">accountability_* · sharing_tokens</text>
  <rect class="box firebase" x="300" y="100" width="200" height="120" rx="10"/>
<text class="t lbl" x="400.0" y="122" text-anchor="middle">users/{{uid}} subs</text>
<text class="t sm" x="400.0" y="138" text-anchor="middle">onboarding · pledges</text>
<text class="t sm" x="400.0" y="152" text-anchor="middle">food_logs · favorites</text>
  <rect class="box firebase" x="540" y="100" width="200" height="120" rx="10"/>
<text class="t lbl" x="640.0" y="122" text-anchor="middle">Firebase Storage</text>
<text class="t sm" x="640.0" y="138" text-anchor="middle">remote audio (NSDR)</text>
  <rect class="box local" x="60" y="260" width="200" height="100" rx="10"/>
<text class="t lbl" x="160.0" y="282" text-anchor="middle">SharedPreferences</text>
<text class="t sm" x="160.0" y="298" text-anchor="middle">streak · onboarding</text>
<text class="t sm" x="160.0" y="312" text-anchor="middle">notification toggles</text>
  <rect class="box local" x="300" y="260" width="200" height="100" rx="10"/>
<text class="t lbl" x="400.0" y="282" text-anchor="middle">Secure storage</text>
<text class="t sm" x="400.0" y="298" text-anchor="middle">install UUID (iOS)</text>
  <rect class="box screen" x="540" y="260" width="200" height="100" rx="10"/>
<text class="t lbl" x="640.0" y="282" text-anchor="middle">Bundled assets</text>
<text class="t sm" x="640.0" y="298" text-anchor="middle">articles · subtitles</text>
<text class="t sm" x="640.0" y="312" text-anchor="middle">sounds · fonts</text>
  <rect class="box inferred" x="760" y="180" width="130" height="80" rx="10"/>
<text class="t lbl" x="825.0" y="202" text-anchor="middle">fasts</text>
<text class="t sm" x="825.0" y="218" text-anchor="middle">rules exist; app uses local only</text>
</svg>
