<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Main data flow</title>
  <desc id="desc">User actions through UI, Cubits/services, and data stores.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Main data flow</text>
  <text class="t sub" x="24" y="54">Typical read/write path across UI, state, services, and storage</text>
  <rect class="box user user" x="30" y="150" width="100" height="50" rx="10"/>
<text class="t lbl" x="80.0" y="172" text-anchor="middle">User action</text>
  <line class="arrow" x1="130" y1="175" x2="170" y2="175"/>
  <rect class="box screen" x="175" y="150" width="110" height="50" rx="10"/>
<text class="t lbl" x="230.0" y="172" text-anchor="middle">Widget</text>
<text class="t sm" x="230.0" y="188" text-anchor="middle">Screen</text>
  <line class="arrow" x1="285" y1="175" x2="325" y2="175"/><text class="t sm" x="305.0" y="169.0" text-anchor="middle">event</text>
  <rect class="box service" x="330" y="150" width="110" height="50" rx="10"/>
<text class="t lbl" x="385.0" y="172" text-anchor="middle">Cubit / Service</text>
<text class="t sm" x="385.0" y="188" text-anchor="middle">business logic</text>
  <line class="arrow" x1="440" y1="175" x2="480" y2="175"/>
  <rect class="box firebase" x="485" y="130" width="120" height="90" rx="10"/>
<text class="t lbl" x="545.0" y="152" text-anchor="middle">Firestore</text>
<text class="t sm" x="545.0" y="168" text-anchor="middle">users · posts</text>
<text class="t sm" x="545.0" y="182" text-anchor="middle">food_logs</text>
  <rect class="box local" x="630" y="130" width="120" height="90" rx="10"/>
<text class="t lbl" x="690.0" y="152" text-anchor="middle">SharedPreferences</text>
<text class="t sm" x="690.0" y="168" text-anchor="middle">streak · onboarding</text>
  <rect class="box external" x="775" y="130" width="120" height="90" rx="10"/>
<text class="t lbl" x="835.0" y="152" text-anchor="middle">Third-party API</text>
<text class="t sm" x="835.0" y="168" text-anchor="middle">Groq · Edamam</text>
  <rect class="box service" x="330" y="280" width="250" height="50" rx="10"/>
<text class="t lbl" x="455.0" y="302" text-anchor="middle">Analytics</text>
<text class="t sm" x="455.0" y="318" text-anchor="middle">Mixpanel events (English)</text>
  <text class="t sm" x="485" y="240">questionnaire · streak · posts · meals</text>
</svg>
