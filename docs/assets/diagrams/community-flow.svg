<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Community flow</title>
  <desc id="desc">Forum posts, comments, chat rooms, and Firestore usage.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Community flow</text>
  <text class="t sub" x="24" y="54">CommunityRepository + Cubits — verified from source</text>
  <rect class="box user user" x="40" y="120" width="110" height="50" rx="10"/>
<text class="t lbl" x="95.0" y="142" text-anchor="middle">User</text>
  <line class="arrow" x1="150" y1="145" x2="190" y2="145"/>
  <rect class="box screen" x="195" y="120" width="130" height="50" rx="10"/>
<text class="t lbl" x="260.0" y="142" text-anchor="middle">CommunityScreen</text>
<text class="t sm" x="260.0" y="158" text-anchor="middle">forum + chat</text>
  <line class="arrow" x1="325" y1="145" x2="365" y2="120"/>
  <rect class="box screen" x="370" y="95" width="150" height="50" rx="10"/>
<text class="t lbl" x="445.0" y="117" text-anchor="middle">Posts &amp; comments</text>
<text class="t sm" x="445.0" y="133" text-anchor="middle">upvotes</text>
  <line class="arrow" x1="325" y1="145" x2="365" y2="175"/>
  <rect class="box screen" x="370" y="165" width="150" height="50" rx="10"/>
<text class="t lbl" x="445.0" y="187" text-anchor="middle">Language chat</text>
<text class="t sm" x="445.0" y="203" text-anchor="middle">official_chat_*</text>
  <line class="arrow" x1="520" y1="120" x2="560" y2="120"/>
  <rect class="box firebase" x="565" y="95" width="160" height="50" rx="10"/>
<text class="t lbl" x="645.0" y="117" text-anchor="middle">community_posts</text>
<text class="t sm" x="645.0" y="133" text-anchor="middle">writes</text>
  <line class="arrow" x1="520" y1="175" x2="560" y2="175"/>
  <rect class="box firebase" x="565" y="165" width="160" height="50" rx="10"/>
<text class="t lbl" x="645.0" y="187" text-anchor="middle">official_chat</text>
<text class="t sm" x="645.0" y="203" text-anchor="middle">real-time</text>
  <rect class="box screen" x="370" y="250" width="200" height="50" rx="10"/>
<text class="t lbl" x="470.0" y="272" text-anchor="middle">Accountability</text>
<text class="t sm" x="470.0" y="288" text-anchor="middle">separate premium flow</text>
</svg>
