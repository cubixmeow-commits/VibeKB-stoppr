<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Onboarding flow</title>
  <desc id="desc">Grouped onboarding stages from welcome through paywall.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>
  <text class="t title" x="24" y="34">Onboarding flow</text>
  <text class="t sub" x="24" y="54">Grouped onboarding stages from welcome through paywall.</text>
<rect class="box screen" x="24" y="90" width="155" height="62" rx="10"/>
<text class="t lbl" x="101.5" y="112" text-anchor="middle">Welcome</text>
<text class="t sm" x="101.5" y="128" text-anchor="middle">WelcomeVideoScreen</text>
<line class="arrow" x1="179" y1="121" x2="194" y2="121"/>
<rect class="box screen" x="194" y="90" width="155" height="62" rx="10"/>
<text class="t lbl" x="271.5" y="112" text-anchor="middle">Account</text>
<text class="t sm" x="271.5" y="128" text-anchor="middle">Apple/Google/Email/Skip</text>
<line class="arrow" x1="349" y1="121" x2="364" y2="121"/>
<rect class="box screen" x="364" y="90" width="155" height="62" rx="10"/>
<text class="t lbl" x="441.5" y="112" text-anchor="middle">Questionnaire</text>
<text class="t sm" x="441.5" y="128" text-anchor="middle">13 questions</text>
<line class="arrow" x1="519" y1="121" x2="534" y2="121"/>
<rect class="box screen" x="534" y="90" width="155" height="62" rx="10"/>
<text class="t lbl" x="611.5" y="112" text-anchor="middle">Profile</text>
<text class="t sm" x="611.5" y="128" text-anchor="middle">ProfileInfoScreen</text>
<line class="arrow" x1="689" y1="121" x2="704" y2="121"/>
<rect class="box screen" x="704" y="90" width="155" height="62" rx="10"/>
<text class="t lbl" x="781.5" y="112" text-anchor="middle">Symptoms &amp; pain</text>
<text class="t sm" x="781.5" y="128" text-anchor="middle">SymptomsScreen</text>
<rect class="box screen" x="24" y="185" width="155" height="62" rx="10"/>
<text class="t lbl" x="101.5" y="207" text-anchor="middle">Goals &amp; benefits</text>
<text class="t sm" x="101.5" y="223" text-anchor="middle">ChooseGoalsOnboarding</text>
<line class="arrow" x1="179" y1="216" x2="194" y2="216"/>
<rect class="box screen" x="194" y="185" width="155" height="62" rx="10"/>
<text class="t lbl" x="271.5" y="207" text-anchor="middle">Analysis</text>
<text class="t sm" x="271.5" y="223" text-anchor="middle">AnalysisResultScreen</text>
<line class="arrow" x1="349" y1="216" x2="364" y2="216"/>
<rect class="box screen" x="364" y="185" width="155" height="62" rx="10"/>
<text class="t lbl" x="441.5" y="207" text-anchor="middle">Commitment</text>
<text class="t sm" x="441.5" y="223" text-anchor="middle">Letter · Vow</text>
<line class="arrow" x1="519" y1="216" x2="534" y2="216"/>
<rect class="box screen" x="534" y="185" width="155" height="62" rx="10"/>
<text class="t lbl" x="611.5" y="207" text-anchor="middle">Ratings</text>
<text class="t sm" x="611.5" y="223" text-anchor="middle">GiveUsRatingsScreen</text>
<line class="arrow" x1="689" y1="216" x2="704" y2="216"/>
<rect class="box premium" x="704" y="185" width="155" height="62" rx="10"/>
<text class="t lbl" x="781.5" y="207" text-anchor="middle">Paywall</text>
<text class="t sm" x="781.5" y="223" text-anchor="middle">PrePaywallScreen</text>
</svg>
