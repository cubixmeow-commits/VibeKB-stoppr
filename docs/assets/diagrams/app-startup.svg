<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Application startup flow</title>
  <desc id="desc">Cold start initialization and initial screen routing in main.dart.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Application startup</text>
  <text class="t sub" x="24" y="54">main() initializes SDKs, then _determineStartScreen() picks the first UI</text>
  <rect class="box screen" x="40" y="90" width="140" height="44" rx="10"/>
<text class="t lbl" x="110.0" y="112" text-anchor="middle">main()</text>
<text class="t sm" x="110.0" y="128" text-anchor="middle">lib/main.dart</text>
  <line class="arrow" x1="110" y1="134" x2="110" y2="165"/>
  <rect class="box service" x="40" y="170" width="140" height="70" rx="10"/>
<text class="t lbl" x="110.0" y="192" text-anchor="middle">Initialize</text>
<text class="t sm" x="110.0" y="208" text-anchor="middle">.env · Firebase</text>
<text class="t sm" x="110.0" y="222" text-anchor="middle">RevenueCat · Mixpanel</text>
  <line class="arrow" x1="110" y1="240" x2="110" y2="270"/>
  <rect class="box service" x="40" y="275" width="140" height="56" rx="10"/>
<text class="t lbl" x="110.0" y="297" text-anchor="middle">runApp</text>
<text class="t sm" x="110.0" y="313" text-anchor="middle">AuthCubit</text>
  <line class="arrow" x1="180" y1="303" x2="220" y2="303"/>
  <rect class="box service" x="225" y="275" width="160" height="56" rx="10"/>
<text class="t lbl" x="305.0" y="297" text-anchor="middle">Startup routing</text>
<text class="t sm" x="305.0" y="313" text-anchor="middle">_determineStartScreen</text>
  <line class="arrow" x1="385" y1="275" x2="420" y2="200"/><text class="t sm" x="402.5" y="231.5" text-anchor="middle">onboarding incomplete</text>
  <rect class="box screen" x="425" y="170" width="150" height="50" rx="10"/>
<text class="t lbl" x="500.0" y="192" text-anchor="middle">Welcome / resume</text>
<text class="t sm" x="500.0" y="208" text-anchor="middle">OnboardingProgress</text>
  <line class="arrow" x1="385" y1="303" x2="420" y2="303"/><text class="t sm" x="402.5" y="297.0" text-anchor="middle">onboarding done, unpaid</text>
  <rect class="box premium" x="425" y="278" width="150" height="50" rx="10"/>
<text class="t lbl" x="500.0" y="300" text-anchor="middle">PrePaywall</text>
<text class="t sm" x="500.0" y="316" text-anchor="middle">Superwall</text>
  <line class="arrow" x1="385" y1="330" x2="420" y2="380"/><text class="t sm" x="402.5" y="349.0" text-anchor="middle">paid / bypass</text>
  <rect class="box screen" x="425" y="360" width="150" height="50" rx="10"/>
<text class="t lbl" x="500.0" y="382" text-anchor="middle">MainScaffold</text>
<text class="t sm" x="500.0" y="398" text-anchor="middle">5 tabs</text>
  <rect class="box group" x="620" y="170" width="240" height="230" rx="10"/>
<text class="t lbl" x="740.0" y="192" text-anchor="middle">Checks (verified from source)</text>
  <rect class="box firebase" x="635" y="200" width="210" height="40" rx="10"/>
<text class="t lbl" x="740.0" y="222" text-anchor="middle">Firebase Auth state</text>
  <rect class="box local" x="635" y="250" width="210" height="40" rx="10"/>
<text class="t lbl" x="740.0" y="272" text-anchor="middle">onboarding_completed pref</text>
  <rect class="box service" x="635" y="300" width="210" height="40" rx="10"/>
<text class="t lbl" x="740.0" y="322" text-anchor="middle">SubscriptionService</text>
  <rect class="box local" x="635" y="350" width="210" height="40" rx="10"/>
<text class="t lbl" x="740.0" y="372" text-anchor="middle">lastOnboardingScreen</text>
  <text class="t lbl" x="40" y="360">Legend</text>
<rect class="box screen" x="40" y="372" width="14" height="14" rx="3"/>
<text class="t sm" x="62" y="384">Entry / screen</text>
<rect class="box service" x="40" y="392" width="14" height="14" rx="3"/>
<text class="t sm" x="62" y="404">Service</text>
<rect class="box premium" x="40" y="412" width="14" height="14" rx="3"/>
<text class="t sm" x="62" y="424">Paywall path</text>
</svg>
