<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Firebase architecture</title>
  <desc id="desc">Firebase products used by Stoppr and connecting app layers.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Firebase architecture</text>
  <text class="t sub" x="24" y="54">Initialized via firebase_options.dart from EnvConfig</text>
  <rect class="box flutter" x="380" y="70" width="140" height="44" rx="10"/>
<text class="t lbl" x="450.0" y="92" text-anchor="middle">Flutter app</text>
  <line class="arrow" x1="450" y1="114" x2="450" y2="145"/>
  <rect class="box firebase" x="350" y="150" width="200" height="44" rx="10"/>
<text class="t lbl" x="450.0" y="172" text-anchor="middle">Firebase.initializeApp</text>
  <rect class="box firebase" x="80" y="230" width="150" height="56" rx="10"/>
<text class="t lbl" x="155.0" y="252" text-anchor="middle">Authentication</text>
<text class="t sm" x="155.0" y="268" text-anchor="middle">Google · Apple · Email</text>
  <rect class="box firebase" x="260" y="230" width="150" height="56" rx="10"/>
<text class="t lbl" x="335.0" y="252" text-anchor="middle">Cloud Firestore</text>
<text class="t sm" x="335.0" y="268" text-anchor="middle">users · community</text>
  <rect class="box firebase" x="440" y="230" width="150" height="56" rx="10"/>
<text class="t lbl" x="515.0" y="252" text-anchor="middle">Cloud Storage</text>
<text class="t sm" x="515.0" y="268" text-anchor="middle">remote audio</text>
  <rect class="box firebase" x="620" y="230" width="150" height="56" rx="10"/>
<text class="t lbl" x="695.0" y="252" text-anchor="middle">FCM</text>
<text class="t sm" x="695.0" y="268" text-anchor="middle">push messages</text>
  <rect class="box firebase" x="260" y="320" width="150" height="56" rx="10"/>
<text class="t lbl" x="335.0" y="342" text-anchor="middle">Crashlytics</text>
<text class="t sm" x="335.0" y="358" text-anchor="middle">prod only</text>
  <rect class="box external" x="440" y="320" width="150" height="56" rx="10"/>
<text class="t lbl" x="515.0" y="342" text-anchor="middle">Firebase Analytics</text>
<text class="t sm" x="515.0" y="358" text-anchor="middle">limited use</text>
  <line class="arrow" x1="450" y1="194" x2="155" y2="230"/><line class="arrow" x1="450" y1="194" x2="335" y2="230"/><line class="arrow" x1="450" y1="194" x2="515" y2="230"/><line class="arrow" x1="450" y1="194" x2="695" y2="230"/>
</svg>
