<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 340" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">Subscription and paywall flow</title>
  <desc id="sp-desc">Superwall UI delegates purchases to SuperwallPurchaseController, which calls RevenueCat. SubscriptionService gates access from CustomerInfo and Superwall status. PostPurchaseHandler runs success side effects. Dashed edges mark Android wiring risk and multi-file success orchestration.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4f5c56"/>
    </marker>
    
    <style>
      .t { font-family:"Figtree","Segoe UI",sans-serif; fill:#1a2421; }
      .box { stroke:#b9c6c0; stroke-width:1.5; fill:#e7f4f0; }
      .gate { fill:#f6ead4; stroke:#7a4210; stroke-width:1.5; }
      .store { fill:#fffcf7; stroke:#b9c6c0; stroke-width:1.5; }
      .warn { fill:#f8e4e0; stroke:#8a2f2f; stroke-width:1.5; }
      .lbl { font-size:12px; font-weight:600; }
      .sm { font-size:10px; fill:#4f5c56; }
      .arrow { stroke:#4f5c56; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .arrow-inferred { stroke:#4f5c56; stroke-width:1.6; fill:none; stroke-dasharray:7 5; marker-end:url(#arrow); }
      .hit { stroke:transparent; stroke-width:16; fill:none; }
      .title { font-size:18px; font-weight:800; font-family:"Outfit","Figtree",sans-serif; }
      .elbl { font-size:9px; fill:#4f5c56; }
    </style>
  </defs>
  <rect width="800" height="340" fill="#f4f0e8"/>
  <text class="t title" x="28" y="36">Subscription and paywall flow</text>
  <text class="t sm" x="28" y="54">Dashed edges mark platform-dependent or multi-file success orchestration.</text>

  <a href="#node-paywall-ui" xlink:href="#node-paywall-ui" class="dnode" data-vibekb-node="paywall-ui">
    <title>Superwall paywall UI — open explanation</title>
    <rect class="gate" x="30" y="130" width="150" height="70" rx="9"/>
    <text class="t lbl" x="105" y="158" text-anchor="middle">Superwall UI</text>
    <text class="t sm" x="105" y="176" text-anchor="middle">placements</text>
  </a>
  <a href="#node-purchase-controller" xlink:href="#node-purchase-controller" class="dnode" data-vibekb-node="purchase-controller">
    <title>SuperwallPurchaseController — open explanation</title>
    <rect class="box" x="220" y="130" width="170" height="70" rx="9"/>
    <text class="t lbl" x="305" y="158" text-anchor="middle">PurchaseController</text>
    <text class="t sm" x="305" y="176" text-anchor="middle">RC bridge</text>
  </a>
  <a href="#node-revenuecat" xlink:href="#node-revenuecat" class="dnode" data-vibekb-node="revenuecat">
    <title>RevenueCat — open explanation</title>
    <rect class="store" x="430" y="130" width="140" height="70" rx="9"/>
    <text class="t lbl" x="500" y="158" text-anchor="middle">RevenueCat</text>
    <text class="t sm" x="500" y="176" text-anchor="middle">CustomerInfo</text>
  </a>
  <a href="#node-access-gate" xlink:href="#node-access-gate" class="dnode" data-vibekb-node="access-gate">
    <title>SubscriptionService gate — open explanation</title>
    <rect class="gate" x="610" y="130" width="160" height="70" rx="9"/>
    <text class="t lbl" x="690" y="158" text-anchor="middle">Access gate</text>
    <text class="t sm" x="690" y="176" text-anchor="middle">isPaidSubscriber</text>
  </a>
  <a href="#node-post-purchase" xlink:href="#node-post-purchase" class="dnode" data-vibekb-node="post-purchase">
    <title>PostPurchaseHandler — open explanation</title>
    <rect class="box" x="220" y="250" width="170" height="60" rx="9"/>
    <text class="t lbl" x="305" y="275" text-anchor="middle">PostPurchaseHandler</text>
    <text class="t sm" x="305" y="293" text-anchor="middle">side effects + nav</text>
  </a>

  <a href="#edge-ui-to-controller" xlink:href="#edge-ui-to-controller" class="dedge" data-vibekb-edge="ui-to-controller">
    <title>delegates to controller — inferred</title>
    <line class="hit" x1="180" y1="165" x2="220" y2="165"/>
    <line class="arrow-inferred" x1="180" y1="165" x2="220" y2="165"/>
    <text class="t elbl" x="175" y="156">delegates-to (inferred)</text>
  </a>
  <a href="#edge-controller-to-rc" xlink:href="#edge-controller-to-rc" class="dedge" data-vibekb-edge="controller-to-rc">
    <title>calls RevenueCat — verified</title>
    <line class="hit" x1="390" y1="165" x2="430" y2="165"/>
    <line class="arrow" x1="390" y1="165" x2="430" y2="165"/>
    <text class="t elbl" x="395" y="156">calls</text>
  </a>
  <a href="#edge-rc-to-gate" xlink:href="#edge-rc-to-gate" class="dedge" data-vibekb-edge="rc-to-gate">
    <title>returns CustomerInfo — verified</title>
    <line class="hit" x1="570" y1="165" x2="610" y2="165"/>
    <line class="arrow" x1="570" y1="165" x2="610" y2="165"/>
    <text class="t elbl" x="572" y="156">returns-to</text>
  </a>
  <a href="#edge-controller-to-post" xlink:href="#edge-controller-to-post" class="dedge" data-vibekb-edge="controller-to-post">
    <title>emits success path — inferred</title>
    <line class="hit" x1="305" y1="200" x2="305" y2="250"/>
    <line class="arrow-inferred" x1="305" y1="200" x2="305" y2="250"/>
    <text class="t elbl" x="312" y="228">emits (inferred)</text>
  </a>

</svg>
