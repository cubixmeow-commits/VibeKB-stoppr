<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">External services map</title>
  <desc id="desc">Third-party systems and what happens if they are unavailable.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">External services</text>
  <text class="t sub" x="24" y="54">Configured via .env / EnvConfig — placeholders if missing</text>
  <rect class="box external" x="60" y="100" width="150" height="70" rx="10"/>
<text class="t lbl" x="135.0" y="122" text-anchor="middle">Firebase</text>
<text class="t sm" x="135.0" y="138" text-anchor="middle">auth · data · push</text>
  <rect class="box external" x="240" y="100" width="150" height="70" rx="10"/>
<text class="t lbl" x="315.0" y="122" text-anchor="middle">RevenueCat</text>
<text class="t sm" x="315.0" y="138" text-anchor="middle">entitlements</text>
  <rect class="box external" x="420" y="100" width="150" height="70" rx="10"/>
<text class="t lbl" x="495.0" y="122" text-anchor="middle">Superwall</text>
<text class="t sm" x="495.0" y="138" text-anchor="middle">paywall UI</text>
  <rect class="box external" x="600" y="100" width="150" height="70" rx="10"/>
<text class="t lbl" x="675.0" y="122" text-anchor="middle">Mixpanel</text>
<text class="t sm" x="675.0" y="138" text-anchor="middle">analytics</text>
  <rect class="box external" x="780" y="100" width="120" height="70" rx="10"/>
<text class="t lbl" x="840.0" y="122" text-anchor="middle">AppsFlyer</text>
<text class="t sm" x="840.0" y="138" text-anchor="middle">attribution</text>
  <rect class="box external" x="60" y="220" width="150" height="70" rx="10"/>
<text class="t lbl" x="135.0" y="242" text-anchor="middle">Groq API</text>
<text class="t sm" x="135.0" y="258" text-anchor="middle">food scan · STT</text>
  <rect class="box external" x="240" y="220" width="150" height="70" rx="10"/>
<text class="t lbl" x="315.0" y="242" text-anchor="middle">OpenAI</text>
<text class="t sm" x="315.0" y="258" text-anchor="middle">chatbot TTS</text>
  <rect class="box external" x="420" y="220" width="150" height="70" rx="10"/>
<text class="t lbl" x="495.0" y="242" text-anchor="middle">Edamam</text>
<text class="t sm" x="495.0" y="258" text-anchor="middle">nutrition · recipes</text>
  <rect class="box external" x="600" y="220" width="150" height="70" rx="10"/>
<text class="t lbl" x="675.0" y="242" text-anchor="middle">Spoonacular</text>
<text class="t sm" x="675.0" y="258" text-anchor="middle">recipe fallback</text>
  <rect class="box warn" x="780" y="220" width="120" height="70" rx="10"/>
<text class="t lbl" x="840.0" y="242" text-anchor="middle">Mux HLS</text>
<text class="t sm" x="840.0" y="258" text-anchor="middle">hardcoded URLs</text>
  <rect class="box warn" x="300" y="340" width="320" height="50" rx="10"/>
<text class="t lbl" x="460.0" y="362" text-anchor="middle">Failure impact</text>
<text class="t sm" x="460.0" y="378" text-anchor="middle">missing keys → degraded or broken feature</text>
</svg>
