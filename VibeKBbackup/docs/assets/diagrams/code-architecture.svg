<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Code architecture</title>
  <desc id="desc">Verified lib/ folder organization for Stoppr.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Code architecture</text>
  <text class="t sub" x="24" y="54">Repository layout — imperative navigation, service singletons, feature modules</text>
  <rect class="box flutter" x="350" y="70" width="200" height="44" rx="10"/>
<text class="t lbl" x="450.0" y="92" text-anchor="middle">lib/main.dart</text>
<text class="t sm" x="450.0" y="108" text-anchor="middle">entry + routing</text>
  <rect class="box screen" x="80" y="150" width="160" height="60" rx="10"/>
<text class="t lbl" x="160.0" y="172" text-anchor="middle">lib/core/</text>
<text class="t sm" x="160.0" y="188" text-anchor="middle">auth · streak</text>
<text class="t sm" x="160.0" y="202" text-anchor="middle">subscription · notifications</text>
  <rect class="box screen" x="270" y="150" width="160" height="60" rx="10"/>
<text class="t lbl" x="350.0" y="172" text-anchor="middle">lib/features/</text>
<text class="t sm" x="350.0" y="188" text-anchor="middle">onboarding · app</text>
<text class="t sm" x="350.0" y="202" text-anchor="middle">community · nutrition</text>
  <rect class="box screen" x="460" y="150" width="160" height="60" rx="10"/>
<text class="t lbl" x="540.0" y="172" text-anchor="middle">lib/features/app/</text>
<text class="t sm" x="540.0" y="188" text-anchor="middle">home · panic · food_scan</text>
  <rect class="box firebase" x="650" y="150" width="160" height="60" rx="10"/>
<text class="t lbl" x="730.0" y="172" text-anchor="middle">firebase_options.dart</text>
<text class="t sm" x="730.0" y="188" text-anchor="middle">platform config</text>
  <rect class="box service" x="80" y="250" width="160" height="60" rx="10"/>
<text class="t lbl" x="160.0" y="272" text-anchor="middle">Repositories</text>
<text class="t sm" x="160.0" y="288" text-anchor="middle">User · Community</text>
<text class="t sm" x="160.0" y="302" text-anchor="middle">Nutrition · Recipe</text>
  <rect class="box service" x="270" y="250" width="160" height="60" rx="10"/>
<text class="t lbl" x="350.0" y="272" text-anchor="middle">Cubits</text>
<text class="t sm" x="350.0" y="288" text-anchor="middle">Auth · Community</text>
<text class="t sm" x="350.0" y="302" text-anchor="middle">Learn · Recipes</text>
  <rect class="box screen" x="460" y="250" width="160" height="60" rx="10"/>
<text class="t lbl" x="540.0" y="272" text-anchor="middle">assets/</text>
<text class="t sm" x="540.0" y="288" text-anchor="middle">l10n · articles · videos</text>
  <rect class="box screen" x="650" y="250" width="160" height="60" rx="10"/>
<text class="t lbl" x="730.0" y="272" text-anchor="middle">android/ · ios/</text>
<text class="t sm" x="730.0" y="288" text-anchor="middle">platform native</text>
</svg>
