<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Panic / craving support flow</title>
  <desc id="desc">Panic button intervention via PanicFlowManager.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Panic / craving support</text>
  <text class="t sub" x="24" y="54">Entry: home panic CTA or stoppr://panic deep link</text>
  <rect class="box screen" x="30" y="130" width="120" height="48" rx="10"/>
<text class="t lbl" x="90.0" y="152" text-anchor="middle">Panic trigger</text>
<text class="t sm" x="90.0" y="168" text-anchor="middle">Home / deep link</text>
  <line class="arrow" x1="150" y1="154" x2="190" y2="154"/>
  <rect class="box screen" x="195" y="130" width="150" height="48" rx="10"/>
<text class="t lbl" x="270.0" y="152" text-anchor="middle">WhatHappening</text>
<text class="t sm" x="270.0" y="168" text-anchor="middle">entry screen</text>
  <line class="arrow" x1="345" y1="154" x2="385" y2="154"/>
  <rect class="box service" x="390" y="120" width="170" height="68" rx="10"/>
<text class="t lbl" x="475.0" y="142" text-anchor="middle">PanicFlowManager</text>
<text class="t sm" x="475.0" y="158" text-anchor="middle">18 randomized tricks</text>
  <line class="arrow" x1="560" y1="154" x2="600" y2="154"/>
  <rect class="box screen" x="605" y="130" width="140" height="48" rx="10"/>
<text class="t lbl" x="675.0" y="152" text-anchor="middle">Interventions</text>
<text class="t sm" x="675.0" y="168" text-anchor="middle">water · exercise</text>
<text class="t sm" x="675.0" y="182" text-anchor="middle">breathing slides</text>
  <line class="arrow" x1="745" y1="154" x2="785" y2="154"/>
  <rect class="box screen" x="790" y="130" width="90" height="48" rx="10"/>
<text class="t lbl" x="835.0" y="152" text-anchor="middle">Congrats</text>
<text class="t sm" x="835.0" y="168" text-anchor="middle">return home</text>
  <rect class="box inferred" x="390" y="230" width="170" height="48" rx="10"/>
<text class="t lbl" x="475.0" y="252" text-anchor="middle">Free quota</text>
<text class="t sm" x="475.0" y="268" text-anchor="middle">5 steps — may apply</text>
</svg>
