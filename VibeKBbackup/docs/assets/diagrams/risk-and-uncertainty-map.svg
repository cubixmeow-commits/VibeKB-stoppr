<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Risk and uncertainty map</title>
  <desc id="desc">Source-grounded areas needing caution, verification, or configuration.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4B5A55"/>
    </marker>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1A2421; }
      .sub { font-size: 13px; fill: #5C6B66; }
      .lbl { font-size: 14px; font-weight: 600; }
      .sm { font-size: 11px; fill: #5C6B66; }
      .box { stroke: #C9D5D0; stroke-width: 1.5; }
      .user { fill: #2F6F5E; stroke: #2F6F5E; }
      .user-t { fill: #fff; font-weight: 700; }
      .flutter { fill: #2B5F8A; stroke: #2B5F8A; }
      .flutter-t { fill: #fff; font-weight: 700; }
      .screen { fill: #E8F2EF; }
      .service { fill: #EDE8F7; }
      .local { fill: #F3EBDD; }
      .firebase { fill: #FFF3D6; }
      .external { fill: #E8E4F4; }
      .premium { fill: #FCE8E4; }
      .warn { fill: #FEF3C7; stroke: #D97706; stroke-dasharray: 4 3; }
      .inferred { fill: #F3F4F6; stroke: #5C6B66; stroke-dasharray: 6 4; }
      .group { fill: #fff; stroke: #C9D5D0; stroke-width: 1.2; }
      .arrow { stroke: #4B5A55; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 10px; font-weight: 700; fill: #5C6B66; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FAF8F4"/>

  <text class="t title" x="24" y="34">Risk &amp; uncertainty map</text>
  <text class="t sub" x="24" y="54">Confirmed vs inferred vs unverified — from .vibekb/memory and source</text>
  <rect class="box warn" x="60" y="90" width="240" height="56" rx="10"/>
<text class="t lbl" x="180.0" y="112" text-anchor="middle">Superwall placement placeholders</text>
<text class="t sm" x="180.0" y="128" text-anchor="middle">INSERT_YOUR_* — HIGH</text>
  <rect class="box warn" x="330" y="90" width="240" height="56" rx="10"/>
<text class="t lbl" x="450.0" y="112" text-anchor="middle">OAuth / API key placeholders</text>
<text class="t sm" x="450.0" y="128" text-anchor="middle">auth may fail</text>
  <rect class="box warn" x="600" y="90" width="240" height="56" rx="10"/>
<text class="t lbl" x="720.0" y="112" text-anchor="middle">iOS widget app group</text>
<text class="t sm" x="720.0" y="128" text-anchor="middle">YOUR_BUNDLE_ID</text>
  <rect class="box inferred" x="60" y="170" width="240" height="56" rx="10"/>
<text class="t lbl" x="180.0" y="192" text-anchor="middle">Feature quotas disabled</text>
<text class="t sm" x="180.0" y="208" text-anchor="middle">A/B test bypass</text>
  <rect class="box inferred" x="330" y="170" width="240" height="56" rx="10"/>
<text class="t lbl" x="450.0" y="192" text-anchor="middle">Accountability matching</text>
<text class="t sm" x="450.0" y="208" text-anchor="middle">Cloud Functions?</text>
  <rect class="box inferred" x="600" y="170" width="240" height="56" rx="10"/>
<text class="t lbl" x="720.0" y="192" text-anchor="middle">Payment runtime</text>
<text class="t sm" x="720.0" y="208" text-anchor="middle">not tested here</text>
  <rect class="box screen" x="60" y="250" width="240" height="56" rx="10"/>
<text class="t lbl" x="180.0" y="272" text-anchor="middle">No automated tests</text>
<text class="t sm" x="180.0" y="288" text-anchor="middle">0 test files</text>
  <rect class="box screen" x="330" y="250" width="240" height="56" rx="10"/>
<text class="t lbl" x="450.0" y="272" text-anchor="middle">Health product copy</text>
<text class="t sm" x="450.0" y="288" text-anchor="middle">not medical advice</text>
  <rect class="box screen" x="600" y="250" width="240" height="56" rx="10"/>
<text class="t lbl" x="720.0" y="272" text-anchor="middle">README App Store note</text>
<text class="t sm" x="720.0" y="288" text-anchor="middle">educational context</text>
  <text class="t lbl" x="60" y="340">Legend</text>
<rect class="box warn" x="60" y="352" width="14" height="14" rx="3"/>
<text class="t sm" x="82" y="364">Risk / config</text>
<rect class="box inferred" x="60" y="372" width="14" height="14" rx="3"/>
<text class="t sm" x="82" y="384">Inferred</text>
<rect class="box screen" x="60" y="392" width="14" height="14" rx="3"/>
<text class="t sm" x="82" y="404">Confirmed gap</text>
</svg>
